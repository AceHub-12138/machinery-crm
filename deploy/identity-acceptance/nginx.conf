events {}

http {
  log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent request_id=$request_id';
  access_log /var/log/nginx/access.log safe;

  server {
    listen 8080;
    server_name identity-acceptance.local;
    client_max_body_size 2m;

    location = /api/mcp {
      proxy_pass http://crm:3010/api/mcp;
      proxy_http_version 1.1;
      proxy_set_header Host identity-acceptance.local;
      proxy_set_header X-Forwarded-Host identity-acceptance.local;
      proxy_set_header X-Forwarded-Proto http;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location = /api/mcp/health {
      proxy_pass http://crm:3010/api/mcp/health;
      proxy_set_header Host identity-acceptance.local;
    }

    location = /api/agent-gateway/chat {
      proxy_pass http://crm:3010/api/agent-gateway/chat;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:18080;
      proxy_set_header X-Forwarded-Host 127.0.0.1:18080;
      proxy_set_header X-Forwarded-Proto http;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://crm:3010;
      proxy_set_header Host 127.0.0.1:18080;
      proxy_set_header X-Forwarded-Host 127.0.0.1:18080;
      proxy_set_header X-Forwarded-Proto http;
    }
  }

  server {
    listen 8081;
    server_name fastgpt-identity-acceptance.local;

    location / {
      proxy_pass http://fastgpt:3000;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:18081;
      proxy_set_header X-Forwarded-Host 127.0.0.1:18081;
      proxy_set_header X-Forwarded-Proto http;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 9000;
    server_name minio-identity-acceptance.local;
    location / {
      proxy_pass http://fastgpt-minio:9000;
    }
  }
}
