name: FULL_READ_ONLY Linux 构建与隔离验收

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unified-readonly-mcp
      - codex/mcp-canary-two-tools
      - codex/mcp-filter-argument-hardening
    paths:
      - .github/workflows/full-readonly-linux-acceptance.yml
      - deploy/identity-acceptance/**
      - deploy/fastgpt/**
      - docs/mcp/**
      - docs/ai-context/00_current_status.md
      - docs/ai-context/06_decisions_log.md
      - n8n/**
      - scripts/**
      - prisma/schema.prisma
      - prisma/migrations/20260814113000_add_ai_lead_pool/**
      - prisma/migrations/20260814170000_add_lead_write_audits/**
      - prisma/migrations/20260818143000_add_lead_write_idempotencies/**
      - src/lib/agent-auth/**
      - src/lib/mcp/**
      - src/app/api/mcp/**
      - src/middleware.ts

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: full-readonly-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-lead-write-migration:
    name: MySQL 5.7 验证 Lead 写审计与幂等回执 migration up/down
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MYSQL_ROOT_PASSWORD: lead-write-migration-ci-only
      MYSQL_DATABASE: lead_write_migration_test
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: lead-write-migration-ci-only
          MYSQL_DATABASE: lead_write_migration_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plead-write-migration-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 拉取精确提交
        uses: actions/checkout@v4

      - name: 验证 Lead 基表、写审计和幂等回执 up、down 与再次 up
        run: |
          mysql_container='${{ job.services.mysql.id }}'
          test -n "$mysql_container"
          mysql_cmd=(docker exec -i -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$mysql_container" mysql -uroot --batch --skip-column-names "$MYSQL_DATABASE")
          "${mysql_cmd[@]}" < prisma/migrations/20260814113000_add_ai_lead_pool/migration.sql
          "${mysql_cmd[@]}" < prisma/migrations/20260814170000_add_lead_write_audits/migration.sql
          "${mysql_cmd[@]}" -e "INSERT INTO leads (id,companyName,source,idempotencyKey,payloadHash,dedupKey,updatedAt) VALUES ('legacy-lead','迁移回填测试','MANUAL','legacy-idempotency',REPEAT('b',64),'legacy-dedup',CURRENT_TIMESTAMP(3))"
          "${mysql_cmd[@]}" < prisma/migrations/20260818143000_add_lead_write_idempotencies/migration.sql
          tables_count="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('leads','lead_feedback_events','lead_write_audits','lead_write_idempotencies')")"
          test "$tables_count" = "4"
          test "$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM lead_write_idempotencies WHERE idempotencyKey='legacy-idempotency' AND payloadHash=REPEAT('b',64) AND leadId='legacy-lead'")" = "1"
          "${mysql_cmd[@]}" -e "INSERT INTO lead_write_audits (id,principalType,principalId,action,entityType,idempotencyKey,outcome,payloadHash,requestId) VALUES ('audit-1','SERVICE','ci-service','LEAD_UPSERT','Lead','idem-1','CREATED',REPEAT('a',64),'request-1')"
          "${mysql_cmd[@]}" < prisma/migrations/20260818143000_add_lead_write_idempotencies/rollback.sql
          test "$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'lead_write_idempotencies'")" = "0"
          "${mysql_cmd[@]}" < prisma/migrations/20260818143000_add_lead_write_idempotencies/migration.sql
          test "$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM lead_write_idempotencies WHERE idempotencyKey='legacy-idempotency'")" = "1"
          "${mysql_cmd[@]}" < prisma/migrations/20260814170000_add_lead_write_audits/rollback.sql
          test "$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'lead_write_audits'")" = "0"
          test "$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('leads','lead_feedback_events')")" = "2"
          "${mysql_cmd[@]}" < prisma/migrations/20260814170000_add_lead_write_audits/migration.sql
          test "$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'lead_write_audits'")" = "1"
          echo "LEAD_WRITE_AUDIT_AND_IDEMPOTENCY_MIGRATION_MYSQL57_UP_DOWN=PASS"

  validate-lead-migration:
    name: MySQL 5.7 验证线索 migration up/down
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MYSQL_ROOT_PASSWORD: lead-migration-ci-only
      MYSQL_DATABASE: lead_migration_test
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: lead-migration-ci-only
          MYSQL_DATABASE: lead_migration_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plead-migration-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 拉取精确提交
        uses: actions/checkout@v4

      - name: 验证 up、唯一约束、down 与再次 up
        run: |
          mysql_container='${{ job.services.mysql.id }}'
          test -n "$mysql_container"
          mysql_cmd=(docker exec -i -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$mysql_container" mysql -uroot --batch --skip-column-names "$MYSQL_DATABASE")
          "${mysql_cmd[@]}" < prisma/migrations/20260814113000_add_ai_lead_pool/migration.sql
          tables_count="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('leads','lead_feedback_events')")"
          test "$tables_count" = "2"
          "${mysql_cmd[@]}" -e "INSERT INTO leads (id, companyName, source, idempotencyKey, dedupKey, updatedAt) VALUES ('lead-1','测试公司','MANUAL','idem-1','dedup-1',CURRENT_TIMESTAMP(3))"
          if "${mysql_cmd[@]}" -e "INSERT INTO leads (id, companyName, source, idempotencyKey, dedupKey, updatedAt) VALUES ('lead-2','重复幂等','MANUAL','idem-1','dedup-2',CURRENT_TIMESTAMP(3))"; then
            echo "idempotencyKey unique constraint did not reject a duplicate" >&2
            exit 1
          fi
          if "${mysql_cmd[@]}" -e "INSERT INTO leads (id, companyName, source, idempotencyKey, dedupKey, updatedAt) VALUES ('lead-3','重复去重','MANUAL','idem-3','dedup-1',CURRENT_TIMESTAMP(3))"; then
            echo "dedupKey unique constraint did not reject a duplicate" >&2
            exit 1
          fi
          "${mysql_cmd[@]}" < prisma/migrations/20260814113000_add_ai_lead_pool/rollback.sql
          tables_count="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('leads','lead_feedback_events')")"
          test "$tables_count" = "0"
          "${mysql_cmd[@]}" < prisma/migrations/20260814113000_add_ai_lead_pool/migration.sql
          tables_count="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name IN ('leads','lead_feedback_events')")"
          test "$tables_count" = "2"
          echo "AI_LEAD_MIGRATION_MYSQL57_UP_DOWN=PASS"

  build-accept-package:
    name: 构建、验收并打包
    needs: [validate-lead-migration, validate-lead-write-migration]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXPECTED_MCP_TOOL_MODE: FULL_READ_ONLY
      IDENTITY_ACCEPTANCE_TOOL_MODE: FULL_READ_ONLY
      IDENTITY_ACCEPTANCE_AUTO_PROVISION_FASTGPT_KEY: "1"
      ACCEPTANCE_ARTIFACT_NAME: dachuan-full-readonly-linux-${{ github.run_id }}
      MCP_ONLY_ARTIFACT_NAME: dachuan-mcp-canary-linux-${{ github.run_id }}

    steps:
      - name: 拉取精确提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装固定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: 清理可信临时 Runner 的无关工具缓存
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
          docker version
          docker compose version

      - name: 预构建外部镜像 tar 身份校验测试
        run: |
          node deploy/identity-acceptance/test-prebuilt-image-archive.mjs

      - name: 报告生成 dry-run 预检
        run: |
          node --check deploy/identity-acceptance/generate-linux-report.mjs
          report_dir="$RUNNER_TEMP/report-dry-run"
          mkdir -p "$report_dir"
          printf 'name\ttag\timageId\tsizeBytes\trepoDigests\nfastgpt\tdachuan-fastgpt:v4\tsha256:one\t1\t\n' > "$report_dir/IMAGE_IDS.tsv"
          printf 'image\tlinuxAmd64ManifestDigest\tociIndexDigest\tconfigDigest\tarchive\nmysql:8.0.44\tsha256:platform\tsha256:index\tsha256:config\tmysql.tar.gz\n' > "$report_dir/EXTERNAL_IMAGE_IDS.tsv"
          printf '{"overallStatus":"PASS","checks":["dry run"],"requestIdSummary":{"count":1,"uniqueCount":1}}' > "$report_dir/evidence.json"
          ARTIFACT_DIR="$report_dir" EVIDENCE_FILE="$report_dir/evidence.json" PREBUILT_REVALIDATED=PASS node deploy/identity-acceptance/generate-linux-report.mjs "$report_dir" "$report_dir/evidence.json"
          test -s "$report_dir/LINUX_ACCEPTANCE_REPORT.md"
          grep -F '`SHA256SUMS`' "$report_dir/LINUX_ACCEPTANCE_REPORT.md"
          grep -F '`docker load`' "$report_dir/LINUX_ACCEPTANCE_REPORT.md"
          grep -F '`--pull never`' "$report_dir/LINUX_ACCEPTANCE_REPORT.md"

      - name: 空缓存拉取并校验固定外部镜像
        run: |
          docker system prune --all --force --volumes
          test -z "$(docker image ls -q)"
          bash deploy/identity-acceptance/pull-external-images.sh
          docker image ls --digests

      - name: 生成仅限本次 Runner 的隔离环境
        run: |
          node deploy/identity-acceptance/prepare-env.mjs \
            deploy/identity-acceptance/.env.identity-acceptance.example \
            deploy/identity-acceptance/.env.identity-acceptance
          chmod 600 deploy/identity-acceptance/.env.identity-acceptance
          node deploy/identity-acceptance/validate-env.mjs deploy/identity-acceptance/.env.identity-acceptance

      - name: 完整执行 start.sh
        run: |
          set -o pipefail
          mkdir -p deploy/identity-acceptance/acceptance-output
          ./deploy/identity-acceptance/start.sh 2>&1 | tee deploy/identity-acceptance/acceptance-output/linux-start.log

      - name: 完整执行 accept.sh
        run: |
          set -o pipefail
          EXPECTED_MCP_TOOL_MODE=FULL_READ_ONLY ./deploy/identity-acceptance/accept.sh 2>&1 | tee deploy/identity-acceptance/acceptance-output/linux-accept.log

      - name: 完整执行 rollback.sh
        run: |
          set -o pipefail
          printf '%s\n' PURGE-IDENTITY-ACCEPTANCE | ./deploy/identity-acceptance/rollback.sh --purge-isolated-data 2>&1 | tee deploy/identity-acceptance/acceptance-output/linux-rollback.log
          test -z "$(docker compose -p dachuan-identity-acceptance --env-file deploy/identity-acceptance/.env.identity-acceptance -f deploy/identity-acceptance/docker-compose.yml ps -q)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=dachuan-identity-acceptance)"
          echo "IDENTITY_ACCEPTANCE_ROLLBACK=PASS"

      - name: 组装三镜像 Linux 验收成品
        env:
          IDENTITY_ACCEPTANCE_VERIFY_PREBUILT: "1"
        run: |
          ./deploy/identity-acceptance/package-linux-artifact.sh "$RUNNER_TEMP/$ACCEPTANCE_ARTIFACT_NAME"
          du -sh "$RUNNER_TEMP/$ACCEPTANCE_ARTIFACT_NAME"
          df -h

      - name: 组装轻量 MCP Canary 成品
        run: |
          full_artifact="$RUNNER_TEMP/$ACCEPTANCE_ARTIFACT_NAME"
          mcp_artifact="$RUNNER_TEMP/$MCP_ONLY_ARTIFACT_NAME"
          mcp_archive="images/dachuanpro-crm-erp-mcp-1.2.0-identity-acceptance.1.tar.gz"
          mcp_image="dachuanpro-crm-erp-mcp:1.2.0-identity-acceptance.1"
          test -s "$full_artifact/$mcp_archive"
          mkdir -p "$mcp_artifact/images"
          cp "$full_artifact/$mcp_archive" "$mcp_artifact/$mcp_archive"
          cp "$full_artifact/deploy/identity-acceptance/validate-prebuilt-image-archive.mjs" "$mcp_artifact/validate-prebuilt-image-archive.mjs"
          IFS=$'\t' read -r config_digest oci_manifest_digest < <(
            node "$mcp_artifact/validate-prebuilt-image-archive.mjs" --identity-digests "$mcp_artifact/$mcp_archive" "$mcp_image"
          )
          IFS=$'\t' read -r name tag image_id size_bytes repo_digests < <(
            awk -F '\t' '$1 == "crm-mcp"' "$full_artifact/IMAGE_IDS.tsv"
          )
          test "$name" = "crm-mcp"
          test "$tag" = "$mcp_image"
          case "$image_id" in
            "$config_digest"|"$oci_manifest_digest") ;;
            *) echo "Unexpected crm-mcp image ID: $image_id" >&2; exit 1 ;;
          esac
          printf 'name\ttag\tconfigDigest\tociManifestDigest\tsizeBytes\trepoDigests\n' > "$mcp_artifact/IMAGE_IDS.tsv"
          printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$tag" "$config_digest" "$oci_manifest_digest" "$size_bytes" "$repo_digests" >> "$mcp_artifact/IMAGE_IDS.tsv"
          test "$(wc -l < "$mcp_artifact/IMAGE_IDS.tsv")" -eq 2
          node "$mcp_artifact/validate-prebuilt-image-archive.mjs" "$mcp_artifact/$mcp_archive" "$tag" "$config_digest" "$oci_manifest_digest"
          cat > "$mcp_artifact/README.md" <<'EOF'
          # MCP Canary 镜像成品

          本成品仅含已经通过 FULL_READ_ONLY Linux 隔离验收的 MCP 镜像归档。
          使用前先执行 `sha256sum -c SHA256SUMS`，再使用内置校验器核验归档标签、平台、Config Digest 与 OCI Manifest Digest，最后以 `docker load -i` 载入镜像。
          Docker 的不同镜像存储后端可能把载入后的 `.Id` 显示为 Config Digest 或 OCI Manifest Digest；`IMAGE_IDS.tsv` 同时记录两者，载入后的值必须匹配其中之一。
          不包含 FastGPT、Mongo、Redis 或任何环境变量；不得将本成品用于正式服务，除非另有独立授权。
          EOF
          (
            cd "$mcp_artifact"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          du -sh "$mcp_artifact"

      - name: 上传可下载 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ACCEPTANCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ACCEPTANCE_ARTIFACT_NAME }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - name: 上传轻量 MCP Canary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MCP_ONLY_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.MCP_ONLY_ARTIFACT_NAME }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
